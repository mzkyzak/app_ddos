plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mzkyzak.ddospro'
    compileSdk 34

    defaultConfig {
        applicationId "com.mzkyzak.ddospro"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
}